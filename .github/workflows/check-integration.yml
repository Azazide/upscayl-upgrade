name: Check the integration branch

# Not part of any pull request. This branch is upgrade-codebase with #1521, #1522, #1523, #1524 and #1525 merged
# together; the jobs build it on Linux and Windows and run scripts/security-check.js against the built project
# (the page loads from file://, the bridge answers, the attacks are refused, the engine is started with the
# paths that were checked). Nothing is packaged or published.
on:
  push:
    branches: [integration]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Libraries for the app and a software Vulkan
        run: sudo apt-get update && sudo apt-get install -y xvfb libvulkan1 mesa-vulkan-drivers libgomp1 libgbm1 libnss3 libgtk-3-0t64 libasound2t64
      # Ubuntu 24.04 keeps unprivileged user namespaces from Chromium's sandbox; the check wants the sandbox on.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm ci
      - run: npm run build
      - name: Security check
        run: xvfb-run -a node scripts/security-check.js --project .

  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Security check
        run: node scripts/security-check.js --project .
